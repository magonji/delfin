<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Delfin" />
    <meta name="theme-color" content="#FAF3E9" />
    <link rel="icon" type="image/svg+xml" href="/app/icons/favicon.svg">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/app/icons/icon-180.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Delfin · Loans and Credit Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================================
        CSS Variables and Global Styles
        ============================================================================ */
        :root {
            --bg: #FAF3E9; --paper: #FFFDFA; --panel: #F3E9DA; --card: #E4D5C1; --border: #D8C6B0;
            --hair: #EFE4D3; --field: #E4D5C1; --muted: #8A7D6C; --text: #23201C; --ink: #23201C; --accent: #B0402E;
            --green: #3C7A57; --red: #B0402E; --yellow: #C6893F; --ink-blue: #3C5A6E; --danger: #B0402E;
            --page-gutter: clamp(16px, 4vw, 30px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scrollbar-gutter: stable both-edges; background: var(--bg); }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh;
               display: flex; flex-direction: column;
               padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom); }

        /* Header (dashboard system) */
        header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 15px 30px; padding-top: calc(15px + env(safe-area-inset-top));
            background: rgba(250,243,233,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .brand .word { font-family: 'Playfair Display', serif; font-size: 25px; font-weight: 800; letter-spacing: -.3px; color: var(--ink); }
        .brand .rule { width: 1px; height: 20px; background: var(--border); }
        .brand .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .dropdown { position: relative; display: inline-flex; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a { font-size: 13px; font-weight: 600; color: var(--muted); padding: 7px 12px; border-bottom: 2px solid transparent; text-decoration: none; }
        .nav-links a:hover { color: var(--ink); }
        .nav-links a.active { color: var(--ink); border-bottom-color: var(--accent); pointer-events: none; }
        /* Action items shown only inside the burger menu on small screens. */
        .nav-action { display: none; cursor: pointer; }
        .burger { display: none; background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--ink); padding: 0 4px; }
        .icon-btn { background: transparent; border: none; padding: 4px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }
        .icon-btn svg { width: 16px; height: 16px; display: block; }
        .icon-btn:hover { color: var(--ink); }
        #btnLogout:hover { color: var(--danger); }
        @keyframes delfinspin { to { transform: rotate(360deg); } }
        #btnRefresh.spinning svg, #btnRefresh svg.spin { animation: delfinspin .9s linear infinite; transform-origin: 50% 50%; }
        .tip-wrap { position: relative; display: inline-flex; }
        .refresh-tip { position: absolute; top: 100%; right: 0; margin-top: 8px; white-space: nowrap;
            background: var(--paper); color: var(--ink); border: 1px solid var(--hair); padding: 6px 10px; border-radius: 8px; font-size: 12px;
            font-family: 'IBM Plex Sans', sans-serif; box-shadow: 0 8px 20px rgba(40,28,14,.18);
            opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity .15s, transform .15s; z-index: 60; }
        .refresh-tip.show { opacity: 1; transform: translateY(0); }
        @media (max-width: 760px) {
            .nav-links { position: absolute; top: calc(100% + 10px); right: 0; flex-direction: column; align-items: stretch;
                background: var(--paper); border: 1px solid var(--hair); border-radius: 12px; box-shadow: 0 12px 30px rgba(40,28,14,.18);
                padding: 8px; min-width: 190px; display: none; }
            #navDropdown.open .nav-links { display: flex; }
            .nav-links a { padding: 10px 12px; border-bottom: none; border-radius: 8px; }
            .nav-links a.active { background: var(--field); border-bottom: none; }
            .burger { display: block; }
            .nav-action { display: block; }
            .nav-action.nav-div { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--hair); }
            .nav-right .tip-wrap, .nav-right > #btnLogout { display: none; }
        }

        /* Utility classes and badges */
        .badge { padding: 2px 8px; border-radius: 99px; font-size: 11px; background: var(--card); border: 1px solid var(--border); }
        .badge_spe {
            display: inline-flex; justify-content: center; align-items: center;
            width: 40px; height: 24px; border-radius: 12px; font-size: 13px;
            background: var(--panel); border: 1px solid var(--border);
        }
        .amount-positive { color: var(--green); }
        .amount-negative { color: var(--red); }
        .footer { text-align: center; margin-top: auto; padding: 104px 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #A99A85; }

        /* Floating actions (unified with the dashboard) */
        .fab-container { position: fixed; bottom: 28px; right: 28px; display: flex; gap: 12px; z-index: 60; }
        .fab-button { border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .18s ease, box-shadow .18s ease; }
        .fab-button:first-child { width: 54px; height: 54px; border-radius: 50%; background: var(--chip, #F1E7D6); color: #3A342C; font-size: 22px; box-shadow: 0 10px 24px rgba(40,28,14,.24); }
        .fab-button:last-child { width: 60px; height: 60px; border-radius: 50%; background: #2B2621; color: #fff; font-size: 30px; font-weight: 300; box-shadow: 0 12px 30px rgba(40,28,14,.4); }
        .fab-button:hover { transform: translateY(-3px) scale(1.05); }

        /* Success and error message boxes */
        .message-box { padding: 15px; border-radius: 8px; margin: 20px; display: none; color: white; text-align: center; }
        .success-message { background: var(--green); }
        .error-message { background: var(--red); }

        /* Page frame + flat sections */
        .content { max-width: 1180px; width: 100%; margin: 0 auto; padding: 26px var(--page-gutter) 80px; flex: 1; }
        .page-title { margin: 0 0 22px; font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 800; line-height: 1; padding-left: 18px; border-left: 3px solid var(--accent); }

        /* KPI band */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
        .kpi-cell { padding: 18px 24px; }
        .kpi-cell:first-child { padding-left: 0; }
        .kpi-cell + .kpi-cell { border-left: 1px solid var(--hair); }
        .kpi-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
        .kpi-val { font-family: 'Playfair Display', serif; font-size: 29px; font-weight: 800; margin: 7px 0 3px; font-variant-numeric: tabular-nums; }
        .kpi-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

        /* Sections */
        .sec { margin-top: 34px; }
        .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 2px solid #2B2621; margin-bottom: 4px; }
        .sechead { margin: 0; font-family: 'Playfair Display', serif; font-size: 25px; font-weight: 800; padding-left: 15px; border-left: 3px solid var(--accent); }
        .sec-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

        /* Debt rows (flat, editorial) */
        .loan-card { background: transparent; border: none; border-bottom: 1px solid var(--hair); border-radius: 0; margin: 0 -8px; padding: 20px 8px; transition: background .15s; }
        .loan-card:hover { box-shadow: none; background: #F4EAD9; }
        .loan-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 0; }
        .loan-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; }
        .loan-toggle { font-size: 12px; transition: transform 0.2s; color: #A2937E; }
        .badge { padding: 2px 9px; border-radius: 99px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; background: var(--panel); border: 1px solid var(--hair); color: var(--muted); }
        .loan-info { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); }
        .progress-bar-container { width: 100%; height: 10px; background: #EDE0CD; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
        .progress-bar { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
        .progress-bar.loan { background: var(--red); }
        .progress-bar.credit-card { background: var(--yellow); }
        .progress-bar.completed { background: var(--green); }
        .loan-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
        .loan-stats > div { padding: 0 16px; border-left: 1px solid var(--hair); }
        .loan-stats > div:first-child { padding-left: 0; border-left: none; }
        .loan-stat-label { font-size: 9.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; }
        .loan-stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; }
        .loan-transactions { display: none; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
        .loan-transactions.expanded { display: block; animation: fadeIn 0.3s; }
        .transaction-item { padding: 9px 0; border-bottom: 1px solid #F3E9DA; display: grid; grid-template-columns: 128px 1fr auto; gap: 12px; align-items: baseline; }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); line-height: 1.3; }
        .transaction-type { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 1px; }
        .transaction-note { font-size: 12px; color: var(--muted); }
        .transaction-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13.5px; }

        /* Transaction type styling */
        .type-payment { color: var(--green); }
        .type-charge { color: #5A4E3C; }
        .type-interest { color: var(--red); }
        .type-transfer { color: var(--ink-blue); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ── Responsive ── */
        @media (max-width: 1000px) {
            .kpi-grid { grid-template-columns: 1fr 1fr; }
            .kpi-cell { padding: 14px 20px; border-top: 1px solid var(--hair); }
            .kpi-cell:nth-child(1), .kpi-cell:nth-child(2) { border-top: none; }
            .kpi-cell:first-child { padding-left: 20px; }
            .kpi-cell:nth-child(odd) { border-left: none; padding-left: 0; }
        }
        @media (max-width: 640px) {
            header { padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
            .brand .tag { display: none; }
            button, select, input, textarea { min-height: 40px; }
            .page-title { font-size: 26px; }
            .sechead { font-size: 21px; }
            .loan-title { font-size: 18px; }
            .loan-stats { grid-template-columns: 1fr 1fr; gap: 12px 0; }
            .loan-stats > div:nth-child(odd) { padding-left: 0; border-left: none; }
            .loan-stat-value { font-size: 15px; }
            .transaction-item { grid-template-columns: 92px 1fr auto; gap: 8px; }
            .message-box { margin: 12px 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="word">Delfin</span>
            <span class="rule"></span>
            <span class="tag">Personal Finance</span>
        </div>
        <div class="nav-right">
            <div class="dropdown" id="navDropdown">
                <button class="burger" id="navBtn" onclick="toggleNav()" aria-label="Menu" aria-expanded="false">&#9776;</button>
                <nav class="nav-links" id="navMenu">
                    <a href="index.html">Dashboard</a>
                    <a href="transactions.html">Transactions</a>
                    <a href="budget.html">Budget</a>
                    <a class="active" href="loans.html">Loans</a>
                    <a href="tools.html">Tools</a>
                    <a href="#" class="nav-action nav-div" onclick="this.closest('.dropdown').classList.remove('open'); document.getElementById('btnRefresh').click(); return false;">Refresh data</a>
                    <a href="#" class="nav-action" onclick="document.getElementById('btnLogout').click(); return false;">Log out</a>
                </nav>
            </div>
            <span class="tip-wrap">
                <button class="icon-btn" id="btnRefresh" title="Refresh" aria-label="Refresh">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
                <span class="refresh-tip" id="refreshTip" role="status"></span>
            </span>
            <button class="icon-btn" id="btnLogout" title="Log out" aria-label="Log out">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>
            </button>
        </div>
    </header>

    <div class="content">
        <h1 class="page-title">Loans &amp; Credit Cards</h1>
        <div class="kpi-grid">
            <div class="kpi-cell"><div class="kpi-label">Total Owed</div><div class="kpi-val" id="totalOwed" style="color:var(--red)">—</div><div class="kpi-sub" id="owedSub"></div></div>
            <div class="kpi-cell"><div class="kpi-label">Interest Paid</div><div class="kpi-val" id="totalInterest" style="color:var(--yellow)">—</div><div class="kpi-sub">lifetime</div></div>
            <div class="kpi-cell"><div class="kpi-label">Active Loans</div><div class="kpi-val" id="activeLoans">—</div><div class="kpi-sub">in repayment</div></div>
            <div class="kpi-cell"><div class="kpi-label">Credit Cards</div><div class="kpi-val" id="activeCreditCards">—</div><div class="kpi-sub">active</div></div>
        </div>

        <div id="successMessage" class="message-box success-message"></div>
        <div id="errorMessage" class="message-box error-message"></div>

        <section class="sec" id="activeLoansSection" style="display:none">
            <div class="sec-head"><h2 class="sechead">Active Loans</h2><span class="sec-count" id="activeLoansCount">0</span></div>
            <div id="activeLoansList"></div>
        </section>

        <section class="sec" id="creditCardsSection" style="display:none">
            <div class="sec-head"><h2 class="sechead">Credit Cards</h2><span class="sec-count" id="creditCardsCount">0</span></div>
            <div id="creditCardsList"></div>
        </section>

        <section class="sec" id="completedLoansSection" style="display:none">
            <div class="sec-head"><h2 class="sechead">Paid Off Loans</h2><span class="sec-count" id="completedLoansCount">0</span></div>
            <div id="completedLoansList"></div>
        </section>

        <div class="footer" id="footerNote">Delfin · balances in GBP at historical rates</div>
    </div>
        
<script>
    // =============================================================================
    // CONFIGURATION & CONSTANTS
    // =============================================================================
    
    const API_BASE = (localStorage.getItem('delfin_api') || (location.pathname.startsWith('/app') ? location.origin : 'http://localhost:8422')).replace(/\/$/, '');
    const q = (sel) => document.querySelector(sel);
    
    // Cache duration: 14 days in milliseconds
    const CACHE_DURATION = 14 * 24 * 60 * 60 * 1000;
    
    // Pattern to identify interest/fee transactions (matches category names)
    const INTEREST_PATTERN = /interest|fee|hipoteca|comisiones|interés|comisión/i;
    
    // Currency symbol for any ISO 4217 code, derived via Intl (falls back to the code).
    // "US$" only earns its space when another dollar is on the page; otherwise
    // the narrow "$" is what someone expects to see. The cache is keyed on both
    // the currency and that verdict, since the verdict changes as data loads.
    const _ambiguousCurrencies = new Set();
    const _currenciesInUse = new Set();
    const _symCache = {};

    const _symbolFor = (currency, display) => {
        try {
            const parts = new Intl.NumberFormat('en', {
                style: 'currency', currency, currencyDisplay: display
            }).formatToParts(0);
            return (parts.find(p => p.type === 'currency') || {}).value || (currency + ' ');
        } catch (e) {
            return currency + ' ';
        }
    };

    function noteCurrenciesInUse(codes) {
        (codes || []).filter(Boolean).forEach(c => _currenciesInUse.add(c));
        const bySymbol = new Map();
        for (const c of _currenciesInUse) {
            const s = _symbolFor(c, 'narrowSymbol');
            bySymbol.set(s, (bySymbol.get(s) || []).concat(c));
        }
        _ambiguousCurrencies.clear();
        for (const sharing of bySymbol.values()) {
            if (sharing.length > 1) sharing.forEach(c => _ambiguousCurrencies.add(c));
        }
    }

    const sym = (currency) => {
        if (!currency) return '';
        const display = _ambiguousCurrencies.has(currency) ? 'symbol' : 'narrowSymbol';
        const key = currency + '/' + display;
        if (_symCache[key] === undefined) _symCache[key] = _symbolFor(currency, display);
        return _symCache[key];
    };

    // Global state for currency display
    let globalCurrency = 'GBP';
    let globalSymbol = '£';

    // =============================================================================
    // API & CACHING LAYER
    // =============================================================================

    /**
     * Makes an API request to the backend
     * @param {string} path - API endpoint path
     * @param {object} opts - Fetch options (method, body, etc.)
     * @returns {Promise<object>} - Parsed JSON response
     */
    async function api(path, opts = {}) {
        const res = await fetch(`${API_BASE}${path}`, {
            headers: { 'Content-Type': 'application/json' },
            ...opts
        });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
    }

    /**
     * Retrieves cached data if still valid
     * @param {string} key - LocalStorage key
     * @returns {object|null} - Cached value or null if expired/missing
     */
    function getCache(key) {
        try {
            const cached = JSON.parse(localStorage.getItem(key));
            if (!cached) return null;
            if (Date.now() - cached.timestamp < CACHE_DURATION) return cached.value;
            localStorage.removeItem(key);
        } catch (e) { console.error(e); }
        return null;
    }

    /**
     * Stores data in cache with timestamp
     * @param {string} key - LocalStorage key
     * @param {object} value - Data to cache
     */
    function setCache(key, value) {
        localStorage.setItem(key, JSON.stringify({ value, timestamp: Date.now() }));
    }

    // =============================================================================
    // DATA LOADING
    // =============================================================================

    /**
     * Loads loan data from cache or API and renders the dashboard
     */
    async function loadData() {
        if (localStorage.getItem('dirty_data')) { localStorage.removeItem('loans_summary'); localStorage.removeItem('loans_details'); localStorage.removeItem('dirty_data'); }
        try {
            // Load summary data (KPIs)
            let summary = getCache('loans_summary');
            if (!summary) {
                summary = await api('/loans/summary');
                setCache('loans_summary', summary);
            }

            // Load detailed loan/card data with transactions
            let details = getCache('loans_details');
            if (!details) {
                details = await api('/loans/details?include_completed=true');
                setCache('loans_details', details);
            }

            // Both are in hand before anything is drawn: the KPI symbol depends on
            // which currencies the accounts below use, so it cannot be settled
            // from the summary alone.
            noteCurrenciesInUse([
                summary.base_currency,
                ...(details.loans || []).map(d => d.account && d.account.currency),
                ...(details.credit_cards || []).map(d => d.account && d.account.currency),
            ]);
            updateSummaryUI(summary);
            renderDashboard(details);

        } catch (e) {
            showError('Error loading data: ' + e.message);
            console.error(e);
        }
    }

    /**
     * Updates the KPI cards with summary statistics
     * @param {object} data - Summary data from API
     */
    function updateSummaryUI(data) {
        globalCurrency = data.base_currency || 'GBP';
        noteCurrenciesInUse([globalCurrency]);
        globalSymbol = sym(globalCurrency);
        const footer = q('#footerNote');
        if (footer) footer.textContent = `Delfin · balances in ${globalCurrency} at historical rates`;
        
        q('#activeCreditCards').textContent = data.active_credit_cards;
        q('#activeLoans').textContent = data.active_loans;
        q('#totalOwed').textContent = `${globalSymbol}${formatNum(data.total_owed)}`;
        q('#totalInterest').textContent = `${globalSymbol}${formatNum(data.total_interest)}`;
        const owedSub = q('#owedSub');
        if (owedSub) {
            const n = (data.active_loans || 0) + (data.active_credit_cards || 0);
            owedSub.textContent = `across ${n} account${n === 1 ? '' : 's'}`;
        }
    }

    /**
     * Renders all dashboard sections (active loans, completed, credit cards)
     * @param {object} data - Detailed loan data from API
     */
    function renderDashboard(data) {
        renderSection('activeLoans', data.loans, 'loan');
        renderSection('completedLoans', data.completed, 'mixed');
        renderSection('creditCards', data.credit_cards, 'card');
    }

    /**
     * Renders a single section of the dashboard
     * @param {string} idPrefix - HTML element ID prefix
     * @param {array} items - Array of loan/card objects
     * @param {string} type - 'loan', 'card', or 'mixed'
     */
    function renderSection(idPrefix, items, type) {
        const section = q(`#${idPrefix}Section`);
        const list = q(`#${idPrefix}List`);
        const count = q(`#${idPrefix}Count`);
        
        if (!items || items.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        count.textContent = `${items.length} account${items.length === 1 ? '' : 's'}`;
        list.innerHTML = items.map(item => {
            const itemType = type === 'mixed' 
                ? (item.account.type === 'CREDIT_CARD' ? 'card' : 'loan')
                : type;
            return displayDebtAccount(item, itemType);
        }).join('');
    }

    // =============================================================================
    // DISPLAY FUNCTIONS
    // =============================================================================

    /**
     * Generates HTML for a single loan or credit card display card
     * Includes progress bar, statistics, and estimated interest rate (for loans)
     * 
     * @param {object} debt - Loan/card data object
     * @param {string} type - 'loan' or 'card'
     * @returns {string} - HTML string for the card
     */
    function displayDebtAccount(debt, type) {
        // Determine account type
        const isCard = type === 'card' || type === 'credit-card';
        const isCompleted = debt.is_completed;
        
        // Calculate progress percentage
        let progress;
        if (isCard) {
            // Credit cards: ratio of current debt to max historical debt
            const currentDebt = Math.max(0, -(debt.current_balance || 0));
            progress = debt.max_debt > 0 ? (currentDebt / debt.max_debt) * 100 : 0;
        } else {
            // Loans: repayment progress
            const totalLiability = debt.borrowed + debt.interest;
            progress = totalLiability > 0 ? (debt.repaid / totalLiability) * 100 : 0;
        }

        // -------------------------------------------------------------------------
        // ESTIMATED INTEREST RATE CALCULATION (loans only)
        // Uses XIRR (Extended Internal Rate of Return) to estimate the effective
        // annual interest rate based on actual cash flows and their dates.
        // -------------------------------------------------------------------------
        let estimatedRate = null;
        if (!isCard && debt.transactions && debt.transactions.length > 0) {
            try {
                // Build cash flow arrays for XIRR calculation
                // Initial borrowed amount is a positive inflow (from lender's perspective)
                const flows = [debt.borrowed];
                const dates = [new Date(debt.open_date)];

                // Add repayments as negative outflows (money leaving the borrower)
                debt.transactions.forEach(t => {
                    if (t.amount > 0) { 
                        flows.push(-t.amount);
                        dates.push(new Date(t.date));
                    }
                });

                // If there's remaining debt, treat it as a future "balloon payment" today
                // This allows rate estimation even for ongoing loans
                if (debt.current_owed > 0.01) {
                    flows.push(-debt.current_owed);
                    dates.push(new Date());
                }

                // Only calculate if we have at least the initial loan plus one payment/balance
                if (flows.length >= 2) {
                    const rateDecimal = calculateXIRR(flows, dates);
                    if (!isNaN(rateDecimal) && isFinite(rateDecimal)) {
                        // Format with appropriate precision
                        const ratePercent = rateDecimal * 100;
                        if (ratePercent >= 0 && ratePercent < 100) {
                            estimatedRate = ratePercent.toFixed(1);
                        } else if (ratePercent >= 100) {
                            estimatedRate = ratePercent.toFixed(0);
                        }
                        // Negative or extremely high rates are shown as N/A
                    }
                }
            } catch (e) {
                console.warn('Error calculating XIRR for', debt.account.name, e);
                estimatedRate = null;
            }
        }

        // Determine progress bar colour based on status
        const barClass = isCompleted ? 'completed' : (isCard ? 'credit-card' : 'loan');
        
        // Format balance display with appropriate colour
        const s = sym(debt.account.currency);
        let balanceDisplay;
        if (isCard) {
            const bal = debt.current_balance;
            const color = bal > 0 ? 'var(--green)' : (bal < 0 ? 'var(--red)' : '#666');
            const sign = bal < 0 ? '-' : (bal > 0 ? '+' : '');
            balanceDisplay = `<span style="color:${color}">${sign}${s}${formatNum(bal)}</span>`;
        } else {
            balanceDisplay = `<span style="color:${isCompleted ? 'var(--green)' : 'var(--red)'}">${s}${formatNum(debt.current_owed)}</span>`;
        }

        // Generate the HTML card
        return `
            <div class="loan-card">
                <div class="loan-header" onclick="toggleTransactions(${debt.account.id})">
                    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0;">
                        <span class="loan-title">${debt.account.name}</span>
                        ${isCompleted ? `<span class="badge" style="color:var(--green);border-color:#B6D2BF;">Paid off</span>` : ''}
                    </div>
                    <span class="loan-toggle" id="toggle-${debt.account.id}">▼</span>
                </div>

                <div class="loan-info">
                    <span>Opened ${formatDate(debt.open_date)}</span>
                    ${!isCard && estimatedRate ? `<span>${estimatedRate}% est. APR</span>` : ''}
                    ${isCard && debt.max_debt > 0 ? `<span>Peak debt ${s}${formatNum(debt.max_debt)}</span>` : ''}
                    ${isCard ? `<span>${debt.unique_payees} payees</span>` : ''}
                    ${debt.close_date ? `<span>Closed ${formatDate(debt.close_date)}</span>` : ''}
                    <span>${debt.lender_name}</span>
                </div>
                
                <div class="progress-bar-container">
                    <div class="progress-bar ${barClass}" style="width: ${Math.min(progress, 100)}%"></div>
                </div>
                
                <div class="loan-stats">
                    <div>
                        <div class="loan-stat-label">${isCard ? 'Charges' : 'Borrowed'}</div>
                        <div class="loan-stat-value">${s}${formatNum(debt.borrowed)}</div>
                    </div>
                    <div>
                        <div class="loan-stat-label">Repaid</div>
                        <div class="loan-stat-value" style="color: var(--green)">${s}${formatNum(debt.repaid)}</div>
                    </div>
                    <div>
                        <div class="loan-stat-label">Interest</div>
                        <div class="loan-stat-value" style="color: var(--yellow)">${s}${formatNum(debt.interest)}</div>
                    </div>
                    <div>
                        <div class="loan-stat-label">${isCard ? 'Balance' : 'Remaining'}</div>
                        <div class="loan-stat-value">${balanceDisplay}</div>
                    </div>
                </div>
                
                <div class="loan-transactions" id="transactions-${debt.account.id}">
                    ${renderTransactions(debt.transactions, debt.account.currency)}
                </div>
            </div>
        `;
    }

    /**
     * Renders the transaction list for a loan/card
     * @param {array} transactions - Array of transaction objects
     * @returns {string} - HTML string for transaction list
     */
    function renderTransactions(transactions, currency) {
        if (!transactions || transactions.length === 0) {
            return '<div style="text-align:center;color:#999;font-size:12px;padding:10px">No transactions</div>';
        }
        
        return transactions.map(t => {
            const dateObj = new Date(t.date);
            const isInterest = INTEREST_PATTERN.test(t.category_name || '');
            const isTransfer = t.location_name?.includes('Transfer');
            
            // Determine transaction type and styling
            let type, typeClass, amountClass;
            
            if (t.amount > 0) {
                // Positive amount = money going into the account (payment)
                if (isTransfer) {
                    type = 'Transfer In';
                    typeClass = 'type-transfer';
                    amountClass = 'amount-positive';
                } else if (isInterest) {
                    type = 'Interest Payment';
                    typeClass = 'type-interest';
                    amountClass = 'amount-negative';
                } else {
                    type = 'Payment';
                    typeClass = 'type-payment';
                    amountClass = 'amount-positive';
                }
            } else {
                // Negative amount = money going out (charge/borrow)
                if (isTransfer) {
                    type = 'Transfer Out';
                    typeClass = 'type-transfer';
                    amountClass = 'amount-negative';
                } else if (isInterest) {
                    type = 'Interest';
                    typeClass = 'type-interest';
                    amountClass = 'amount-negative';
                } else {
                    type = 'Charge';
                    typeClass = 'type-charge';
                    amountClass = 'amount-negative';
                }
            }

            return `
                <div class="transaction-item">
                    <div class="transaction-date">${dateObj.toLocaleDateString('en-GB')}<br>${dateObj.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}</div>
                    <div class="transaction-details">
                        <div class="transaction-type ${typeClass}">${type}</div>
                        <div class="transaction-note">${t.payee_name || t.category_name || t.note || ''}</div>
                    </div>
                    <div class="transaction-amount ${amountClass}">
                        ${sym(currency)}${formatNum(Math.abs(t.amount))}
                    </div>
                </div>
            `;
        }).join('');
    }

    // =============================================================================
    // UTILITY FUNCTIONS
    // =============================================================================

    /**
     * Formats a number with thousand separators and 2 decimal places
     * @param {number} n - Number to format
     * @returns {string} - Formatted string (e.g., "1,234.56")
     */
    function formatNum(n) { 
        return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); 
    }
    
    /**
     * Formats a date string to UK format (DD/MM/YYYY)
     * @param {string} d - Date string
     * @returns {string} - Formatted date
     */
    function formatDate(d) { 
        return new Date(d).toLocaleDateString('en-GB'); 
    }
    
    /**
     * Toggles the expanded state of a loan's transaction list
     * @param {number} id - Account ID
     */
    function toggleTransactions(id) {
        const el = q(`#transactions-${id}`);
        const btn = q(`#toggle-${id}`);
        el.classList.toggle('expanded');
        btn.style.transform = el.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    // =============================================================================
    // MESSAGE DISPLAY
    // =============================================================================

    function showSuccess(msg) { msgBox('successMessage', msg); }
    function showError(msg) { msgBox('errorMessage', msg); }
    
    /**
     * Displays a temporary message box
     * @param {string} id - Element ID for the message box
     * @param {string} msg - Message to display
     */
    function msgBox(id, msg) {
        const el = q(`#${id}`);
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    /** Toggles the navigation dropdown menu */
    function toggleNav() {
        q('#navDropdown').classList.toggle('open');
    }

    // =============================================================================
    // EVENT HANDLERS
    // =============================================================================

    /**
     * Full refresh: recalculate balances, payee stats, clear cache, reload
     */
    // Refresh: spin the icon (via CSS) and show the current stage in a tooltip on hover.
    const _refreshTip = q('#refreshTip');
    function setRefreshStage(text) { _refreshTip.textContent = text || ''; if (!text) _refreshTip.classList.remove('show'); }
    (() => {
        const btn = q('#btnRefresh');
        btn.addEventListener('mouseenter', () => { if (btn.classList.contains('spinning') && _refreshTip.textContent) _refreshTip.classList.add('show'); });
        btn.addEventListener('mouseleave', () => _refreshTip.classList.remove('show'));
    })();
    async function refreshCache() {
        const btn = q('#btnRefresh');
        if (btn.classList.contains('spinning')) return;
        btn.disabled = true;
        btn.classList.add('spinning');
        const wasHovered = btn.matches(':hover');
        try {
            Object.keys(localStorage).filter(k => k.startsWith('cache_')).forEach(k => localStorage.removeItem(k));
            localStorage.removeItem('loans_summary');
            localStorage.removeItem('loans_details');
            setRefreshStage('Recalculating balances…');
            if (wasHovered) _refreshTip.classList.add('show');
            await fetch(`${API_BASE}/admin/initialise-balances`, { method: 'POST' });
            setRefreshStage('Updating payee statistics…');
            await fetch(`${API_BASE}/payees/recalculate-all-stats`, { method: 'POST' });
            setRefreshStage('Refreshing display…');
            await loadData();
        } catch (e) { alert('Error: ' + e.message); }
        finally { btn.classList.remove('spinning'); btn.disabled = false; setRefreshStage(''); }
    }

    // Refresh button handler
    q('#btnRefresh').addEventListener('click', () => refreshCache());

    // Close nav menu when clicking a navigation item
    q('#navMenu').addEventListener('click', (e) => {
        if (e.target.matches('.navItem') && e.target.id !== 'btnRefresh') {
            q('#navDropdown').classList.remove('open');
        }
    });

    // Close dropdown when clicking outside
    window.onclick = (e) => {
        if (!e.target.matches('#navBtn')) q('#navDropdown').classList.remove('open');
    }
    
    // Load data when DOM is ready
    document.addEventListener('DOMContentLoaded', loadData);

    // =============================================================================
    // XIRR CALCULATION (Extended Internal Rate of Return)
    // =============================================================================
    
    /**
     * Calculates the annualised Internal Rate of Return for irregular cash flows.
     * 
     * XIRR finds the discount rate that makes the Net Present Value (NPV) of all
     * cash flows equal to zero. Unlike standard IRR, it handles payments that
     * occur on arbitrary dates rather than regular intervals.
     * 
     * The calculation uses Newton-Raphson iteration to solve:
     *   Σ (cashflow[i] / (1 + rate)^(days[i]/365)) = 0
     * 
     * @param {number[]} values - Array of cash flows (positive = inflow, negative = outflow)
     * @param {Date[]} dates - Array of dates corresponding to each cash flow
     * @param {number} guess - Initial rate estimate (default: 0.1 = 10%)
     * @returns {number} - Annualised rate as decimal (e.g., 0.05 = 5%), or NaN if no solution
     * 
     * @example
     *   // Loan of £10,000 on 1 Jan, repaid £11,000 on 1 Jan next year
     *   calculateXIRR([10000, -11000], [new Date('2024-01-01'), new Date('2025-01-01')])
     *   // Returns: 0.10 (10% annual rate)
     */
    function calculateXIRR(values, dates, guess = 0.1) {
        // Input validation
        if (!values || !dates || values.length < 2 || values.length !== dates.length) {
            return NaN;
        }
        
        // IRR requires at least one positive and one negative cash flow
        const hasPositive = values.some(v => v > 0);
        const hasNegative = values.some(v => v < 0);
        if (!hasPositive || !hasNegative) {
            return NaN;
        }
        
        /**
         * NPV function: calculates the sum of discounted cash flows
         * @param {number} r - Discount rate to test
         * @returns {number} - NPV at this rate (should be 0 at the IRR)
         */
        const fx = (r) => {
            // Guard against rates that would cause mathematical errors
            if (r <= -1) return Infinity;
            
            let sum = 0;
            for (let i = 0; i < values.length; i++) {
                // Calculate days from first cash flow
                const days = (dates[i] - dates[0]) / (1000 * 60 * 60 * 24);
                const exponent = days / 365;
                const base = 1 + r;
                
                // Prevent Math.pow errors with negative base
                if (base <= 0) return Infinity;
                
                sum += values[i] / Math.pow(base, exponent);
            }
            return sum;
        };

        /**
         * Derivative of NPV function (needed for Newton-Raphson)
         * @param {number} r - Discount rate
         * @returns {number} - Derivative of NPV with respect to rate
         */
        const dfx = (r) => {
            if (r <= -1) return 0;
            
            let sum = 0;
            for (let i = 0; i < values.length; i++) {
                const days = (dates[i] - dates[0]) / (1000 * 60 * 60 * 24);
                const exponent = days / 365;
                const base = 1 + r;
                
                if (base <= 0) return 0;
                
                sum += -exponent * values[i] / Math.pow(base, exponent + 1);
            }
            return sum;
        };

        // Try multiple starting guesses to improve convergence
        // Different loan structures may converge better from different starting points
        const guesses = [guess, 0.05, 0.15, 0.25, 0.5, -0.5];
        
        for (const initialGuess of guesses) {
            let rate = initialGuess;
            let converged = false;
            
            // Newton-Raphson iteration: rate_new = rate - f(rate) / f'(rate)
            for (let i = 0; i < 100; i++) {
                const y = fx(rate);
                const dy = dfx(rate);
                
                // Check for numerical issues
                if (!isFinite(y) || !isFinite(dy)) break;
                if (Math.abs(dy) < 1e-12) break; // Derivative too small
                
                const newRate = rate - y / dy;
                
                // Clamp the change to prevent wild oscillations
                const maxChange = 1.0;
                const clampedRate = Math.max(rate - maxChange, Math.min(rate + maxChange, newRate));
                
                // Check for convergence (rate has stabilised)
                if (Math.abs(clampedRate - rate) < 1e-8) {
                    converged = true;
                    rate = clampedRate;
                    break;
                }
                rate = clampedRate;
            }
            
            // Accept the result if it converged to a reasonable rate (-99% to 1000%)
            if (converged && rate > -0.99 && rate < 10) {
                return rate;
            }
        }
        
        // No solution found
        return NaN;
    }
</script>

(function(){
  const _fetch = window.fetch;
  window.fetch = async function(){
    const res = await _fetch.apply(this, arguments);
    if (res.status === 401 && !location.pathname.endsWith('/login.html')) location.href = '/login.html';
    return res;
  };
  document.addEventListener('DOMContentLoaded', function(){
    const btn = document.getElementById('btnLogout');
    if (btn) btn.onclick = async function(){ try { await fetch('/auth/logout', {method:'POST'}); } finally { location.href = '/login.html'; } };
  });
})();
